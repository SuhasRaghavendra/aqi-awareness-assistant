name: CD - Container Release & Deployment

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build, Verify Bundle, Trivy Scan, and Push to GHCR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build, Verify, Scan & Push Container
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image_info.outputs.image_name }}
      short_sha: ${{ steps.image_info.outputs.short_sha }}
      tag_version: ${{ steps.image_info.outputs.tag_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies for bundle verification
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-serve.txt

      - name: Verify champion bundle and risk card gates
        run: |
          python -c "
          from pathlib import Path
          from src.models.package_model import check_gate_policy, read_json
          from src.serving.bundle import sha256_file

          root = Path('.')
          bundle_dir = root / 'artifacts/champion'
          manifest_file = bundle_dir / 'MANIFEST.json'
          manifest_sha_file = bundle_dir / 'MANIFEST.sha256'

          if not manifest_file.exists():
              raise FileNotFoundError(f'Missing manifest file: {manifest_file}')
          if not manifest_sha_file.exists():
              raise FileNotFoundError(f'Missing manifest SHA file: {manifest_sha_file}')

          recorded_sha = manifest_sha_file.read_text(encoding='utf-8').strip()
          computed_sha = sha256_file(manifest_file)
          if recorded_sha != computed_sha:
              raise ValueError(
                  f'MANIFEST.sha256 mismatch!\nRecorded: {recorded_sha}\nComputed: {computed_sha}'
              )

          risk_card = read_json(root / 'reports/metrics/model_risk_card.json')
          gate_status = check_gate_policy(risk_card)
          print(f'[OK] Champion bundle verified: MANIFEST.sha256 matches MANIFEST.json')
          print(f'[OK] Risk card gate policy passed: {gate_status}')
          "

      - name: Compute lowercase image name and tags
        id: image_info
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME}"
          else
            TAG_VERSION="latest"
          fi
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_NAME}, Short SHA: ${SHORT_SHA}, Version: ${TAG_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (linux/amd64, load for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image_info.outputs.image_name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.image_info.outputs.image_name }}:test
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images to GHCR
        run: |
          IMAGE="${{ steps.image_info.outputs.image_name }}"
          SHORT_SHA="${{ steps.image_info.outputs.short_sha }}"
          VERSION_TAG="${{ steps.image_info.outputs.tag_version }}"

          echo "Pushing images for: ${IMAGE}"

          # 1. Tag and push sha-<short sha>
          docker tag "${IMAGE}:test" "${IMAGE}:sha-${SHORT_SHA}"
          docker push "${IMAGE}:sha-${SHORT_SHA}"

          # 2. Tag and push version from git tag
          docker tag "${IMAGE}:test" "${IMAGE}:${VERSION_TAG}"
          docker push "${IMAGE}:${VERSION_TAG}"

          # 3. Tag and push latest
          docker tag "${IMAGE}:test" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to Render and Run Smoke Test
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloud & Smoke Test
    needs: [build-and-push]
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine previous image tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            PREV_REF="sha-$(git rev-parse --short HEAD~1 2>/dev/null || echo 'initial')"
          else
            PREV_REF="$PREV_TAG"
          fi
          PREV_IMAGE="${{ needs.build-and-push.outputs.image_name }}:${PREV_REF}"
          echo "previous_image=${PREV_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Previous deployment image identified as: ${PREV_IMAGE}"

      - name: Trigger Render Deployment Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Run Smoke Test on Deployed Service
        id: smoke_test
        env:
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::SERVICE_URL secret is not configured."
            exit 1
          fi
          python scripts/smoke_test.py --url "$SERVICE_URL"

      - name: Handle Failure & Print Rollback Instructions
        if: failure()
        run: |
          echo "::error::Smoke test failed! The deployed service is not healthy."
          echo "=================================================================="
          echo "DEPLOYMENT ROLLBACK REQUIRED"
          echo "Redeploy the previous working container image tag:"
          echo "Previous Image Tag: ${{ steps.prev_tag.outputs.previous_image }}"
          echo "Docker pull command:"
          echo "  docker pull ${{ steps.prev_tag.outputs.previous_image }}"
          echo "=================================================================="
          exit 1
