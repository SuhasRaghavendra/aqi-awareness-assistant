name: CI - Model Quality & Service Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint & Code Style Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Check code formatting (Black)
        run: black --check .

      - name: Lint codebase (Ruff)
        run: ruff check .

  test-suite:
    name: Automated Unit & Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt -r requirements-dev.txt

      - name: Run FastAPI Service Tests
        run: pytest tests/test_service.py -v

  docker-smoke-test:
    name: Container Build & Smoke Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-suite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker-setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t aqi-predictor:test .

      - name: Execute container smoke test
        run: |
          chmod +x scripts/test_container.sh
          ./scripts/test_container.sh

