# CPCB National AQI Breakpoints
# Source: Central Pollution Control Board, "National Air Quality Index",
#         https://cpcb.nic.in/displaypdf.php?id=eHViZC9OQVFJLUVuZ2xpc2gudGlmeQ==
# (Cross-check every value against the official document before use.)
#
# Format for each pollutant:
#   Each entry is [C_low, C_high, I_low, I_high] where
#     C_low / C_high : concentration range (µg/m³ unless noted)
#     I_low / I_high : corresponding sub-index range
#
# Category bands (sub-index → label):
#   0–50   : Good
#   51–100 : Satisfactory
#   101–200: Moderate
#   201–300: Poor
#   301–400: Very Poor
#   401–500: Severe

pm25:  # 24-hour average, µg/m³
  breakpoints:
    - [0.0,   30.0,   0,   50]
    - [30.0,  60.0,  51,  100]
    - [60.0,  90.0, 101,  200]
    - [90.0, 120.0, 201,  300]
    - [120.0, 250.0, 301, 400]
    - [250.0, 380.0, 401, 500]

pm10:  # 24-hour average, µg/m³
  breakpoints:
    - [0.0,   50.0,   0,   50]
    - [50.0,  100.0,  51,  100]
    - [100.0, 250.0, 101,  200]
    - [250.0, 350.0, 201,  300]
    - [350.0, 430.0, 301,  400]
    - [430.0, 600.0, 401,  500]

no2:  # 24-hour average, µg/m³
  breakpoints:
    - [0.0,   40.0,   0,   50]
    - [40.0,   80.0,  51,  100]
    - [80.0,  180.0, 101,  200]
    - [180.0, 280.0, 201,  300]
    - [280.0, 400.0, 301,  400]
    - [400.0, 800.0, 401,  500]

so2:  # 24-hour average, µg/m³
  breakpoints:
    - [0.0,   40.0,   0,   50]
    - [40.0,   80.0,  51,  100]
    - [80.0,  380.0, 101,  200]
    - [380.0, 800.0, 201,  300]
    - [800.0, 1600.0, 301, 400]
    - [1600.0, 2620.0, 401, 500]

co:  # 8-hour running mean (daily max), mg/m³
  breakpoints:
    - [0.0,   1.0,   0,   50]
    - [1.0,   2.0,  51,  100]
    - [2.0,  10.0, 101,  200]
    - [10.0,  17.0, 201,  300]
    - [17.0,  34.0, 301,  400]
    - [34.0,  46.0, 401,  500]

o3:  # 8-hour running mean (daily max), µg/m³
  breakpoints:
    - [0.0,   50.0,   0,   50]
    - [50.0,  100.0,  51,  100]
    - [100.0, 168.0, 101,  200]
    - [168.0, 208.0, 201,  300]
    - [208.0, 748.0, 301,  400]
    - [748.0, 1000.0, 401, 500]

nh3:  # 24-hour average, µg/m³
  breakpoints:
    - [0.0,   200.0,   0,   50]
    - [200.0,  400.0,  51,  100]
    - [400.0,  800.0, 101,  200]
    - [800.0, 1200.0, 201,  300]
    - [1200.0, 1800.0, 301, 400]
    - [1800.0, 2400.0, 401, 500]

pb:  # Lead, 24-hour average, µg/m³
  breakpoints:
    - [0.0,   0.5,   0,   50]
    - [0.5,   1.0,  51,  100]
    - [1.0,   2.0, 101,  200]
    - [2.0,   3.0, 201,  300]
    - [3.0,   3.5, 301,  400]
    - [3.5,   5.0, 401,  500]
