seed: 42

# --- Frozen-split integrity (ADR D-033) ---
# Any change here must be deliberate: the md5 of a split is part of the
# champion's provenance. `scripts/audit_integrity.py` and
# `tests/test_data_integrity.py` fail when a file no longer matches.
integrity:
  train_md5: 49bd4c88748327afa12057c2fe71b0e7
  val_md5: 462b7712b4cea342fe36ca80868a29f4
  test_md5: bd1de9ea97083402bd9ccaceb1072e3c

data:
  window_start: "2019-01-01"
  snapshot_end: "2026-09-30"
  cities:
    - Delhi
    - Mumbai
    - Bengaluru
    - Chennai
    - Kolkata
    - Hyderabad
    - Pune
    - Ahmedabad
    - Lucknow

# --- AQI labels from XKDR India Air Quality Database ---
aqi:
  source: xkdr          # xkdr | datagov
  aqi_parameter: AQI    # parameter name in XKDR API
  min_valid_days_per_city_year: 180  # drop city-year if fewer valid AQI days

# --- Fire events from NASA FIRMS VIIRS ---
fires:
  source: firms_viirs_snpp   # VIIRS_SNPP_SP (Standard Processing)
  radius_km: 500             # aggregate fires within this radius of each city
  country_code: IND

# --- Weather from Open-Meteo ERA5 (no key required) ---
weather:
  variables:
    - temperature_2m_mean
    - temperature_2m_max
    - temperature_2m_min
    - relative_humidity_2m_mean
    - wind_speed_10m_mean
    - wind_direction_10m_dominant
    - precipitation_sum
    - surface_pressure_mean
    - vapour_pressure_deficit_mean

# --- Vehicle data from data.gov.in ---
vehicles:
  source: datagov           # data.gov.in API
  granularity: state_year   # annual state-wise totals interpolated to daily

# --- Industrial data (MOSPI IIP + CEA) ---
industrial:
  iip_source: mospi_manual  # manually downloaded CSV from esankhyiki.mospi.gov.in
  power_source: cea_manual  # manually downloaded from npp.gov.in

# --- Feature engineering ---
features:
  horizon_days: 1
  aqi_lags: [1, 3, 7, 14]
  fire_lags: [1, 3, 7]
  rolling_windows: [7, 14, 30]
  use_calendar: true
  use_city_onehot: true

# --- Chronological split ---
# ADR D-018: restored to D-004 documented split (train<=2023, val 2024, test 2025+)
split:
  train_end: "2023-12-31"
  val_end:   "2024-12-31"

# --- Cleaning ---
clean:
  max_missing_frac_row: 0.5
  ffill_limit_days: 3
  winsor_lower_q: 0.005
  winsor_upper_q: 0.995

# --- Training ---
train:
  models:
    - persistence
    - seasonal_naive
    - city_month_mean
    - ridge
    - random_forest
    - xgboost
    - lightgbm
    - residual_ridge       # Phase 0.4: persistence-anchored Ridge (TimeSeriesSplit CV)
    - residual_lightgbm    # Phase 0.4: persistence-anchored LightGBM (TimeSeriesSplit CV)
  cv_folds: 4

  # --- Gate 3 (ADR D-030/D-031) ---
  # Monotone fire/wind constraints restore the 5% metamorphic gate; every city
  # receives the same additive calibration fitted on validation inner folds.
  monotone:
    enabled: true
    objectives: [l2, huber]
    constraints_method: advanced
    calibration_folds: 4
    huber_alpha: 0.9
