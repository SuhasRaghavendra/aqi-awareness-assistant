[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aqi-awareness-assistant"
version = "0.1.0"
description = "AI-Based Air Quality Awareness Assistant — MLOps Milestone 1"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "model: model-risk and quality-gate tests (require trained artifacts)",
    "service: FastAPI contract, parity and latency tests",
    "data: tests that need the full DVC-managed splits",
    "registry: MLflow registry parity tests",
    "slow: long-running checks",
]
